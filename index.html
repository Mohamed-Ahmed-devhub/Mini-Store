<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mini Store</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>


    <nav class="navbar bg-body-tertiary shadow-sm">
        <div class="container">

            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="#">
                <img src="icon/online-store.png" alt="Mini Store Logo" width="45" height="45">
                <span class="fs-4">Mini Store</span>
            </a>

            <form class="d-flex align-items-center gap-2" role="search">
                <input id="searchInput" class="form-control" type="search" placeholder="Search Products..."
                    aria-label="Search" style="width: 300px;">

                <button class="btn btn-outline-primary" type="button">
                    <i class="bi bi-search"></i>
                </button>
            </form>

        </div>
    </nav>

    <section class="py-5 text-center">
        <div class="container">
            <h1 class="fw-bold">Discover Amazing Products</h1>

            <p class="text-muted fs-6">
                Browse thousands of products with the best prices.
            </p>
        </div>
    </section>



    <section class="py-4">
        <div class="container">
            <div id="products" class="products-container">

            </div>
        </div>
    </section>


    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>

</body>

</html>
